name: Update Ryder clone-count badge

on:
  schedule:
    - cron: "7 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  OWNER: YaqiangCao
  REPO: ryder
  GIST_ID: 3e13bd554104e813cad0dc10413389c3
  GIST_FILE: ryder_clone.json

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch latest GitHub clone traffic
        env:
          TOKEN: ${{ secrets.RYDER_TRAFFIC_GIST_TOKEN }}
        run: |
          set -euo pipefail

          curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${OWNER}/${REPO}/traffic/clones?per=day" \
            > current.json

          cat current.json

          if jq -e '.message? // empty' current.json >/dev/null; then
            echo "GitHub API returned an error. Check RYDER_TRAFFIC_GIST_TOKEN permissions."
            exit 1
          fi

      - name: Download previous accumulated clone counts from gist
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://gist.githubusercontent.com/${OWNER}/${GIST_ID}/raw/${GIST_FILE}" \
            -o previous.json \
            || echo '{"count":0,"uniques":0,"clones":[]}' > previous.json

      - name: Merge clone counts
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open("current.json", "r", encoding="utf-8") as f:
              current = json.load(f)

          try:
              with open("previous.json", "r", encoding="utf-8") as f:
                  previous = json.load(f)
          except Exception:
              previous = {"count": 0, "uniques": 0, "clones": []}

          merged = {}

          for item in previous.get("clones", []):
              if "timestamp" in item:
                  merged[item["timestamp"]] = {
                      "timestamp": item["timestamp"],
                      "count": int(item.get("count", 0)),
                      "uniques": int(item.get("uniques", 0)),
                  }

          for item in current.get("clones", []):
              if "timestamp" in item:
                  merged[item["timestamp"]] = {
                      "timestamp": item["timestamp"],
                      "count": int(item.get("count", 0)),
                      "uniques": int(item.get("uniques", 0)),
                  }

          clones = [merged[timestamp] for timestamp in sorted(merged)]

          output = {
              "count": sum(item["count"] for item in clones),
              "uniques": sum(item["uniques"] for item in clones),
              "clones": clones,
          }

          with open("ryder_clone.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=4)
              f.write("\n")

          print(json.dumps({
              "count": output["count"],
              "uniques": output["uniques"],
              "n_days": len(output["clones"])
          }, indent=2))
          PY

      - name: Update Ryder clone-count file in gist
        env:
          TOKEN: ${{ secrets.RYDER_TRAFFIC_GIST_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          content = Path("ryder_clone.json").read_text(encoding="utf-8")

          payload = {
              "description": "Clone statistics badges for YaqiangCao repositories",
              "files": {
                  "ryder_clone.json": {
                      "content": content
                  }
              }
          }

          Path("payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl -sS -L -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "https://api.github.com/gists/${GIST_ID}" \
            > update_response.json

          if jq -e '.message? // empty' update_response.json >/dev/null; then
            cat update_response.json
            echo "Gist update failed."
            exit 1
          fi

          echo "Updated ${GIST_FILE} in gist ${GIST_ID}"
